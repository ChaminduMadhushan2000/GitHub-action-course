name: 01 - Building Blocks

on: push

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: FailedStep
        run: |
          echo "Failed"
          exit 1
      - name: Say Goodbye
        run: echo "Goodbye!"